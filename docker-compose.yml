services:
  server:
    image: tarunadithya/ai-study-server:latest
    container_name: ai-study-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - MONGODB_URI=${MONGODB_URI}
      - CLIENT_URL=http://localhost:80
    ports:
      - "5000:5000"
    networks:
      - app-network

  client:
    image: tarunadithya/ai-study-client:latest
    container_name: ai-study-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
